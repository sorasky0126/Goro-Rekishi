<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>年号・語呂合わせ（タップで表示／非表示）</title>
  <style>
    body{font-family: system-ui,-apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", Roboto, "Yu Gothic", sans-serif; padding:20px; background:#f7fafc; color:#0f172a}
    h1{font-size:1.25rem; margin-bottom:0.5rem}
    p.note{margin-top:0; margin-bottom:1rem; color:#475569}
    .controls{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
    button{background:#0369a1;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
    input[type=file]{padding:6px}
    table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,0.05)}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e6eef6}
    th{background:#f1f5f9;font-weight:600}
    tr:last-child td{border-bottom:none}
    .toggle-mask{cursor:pointer;display:inline-block;padding:6px;border-radius:6px}
    .toggle-mask:focus{outline:3px solid rgba(3,105,161,0.15)}
    .masked-text{letter-spacing:0.08em; font-weight:600}
    .muted{color:#64748b;font-size:0.95rem}
    .error{color:#b91c1c;padding:8px;background:#fff1f2;border-radius:6px}
    .hint{color:#0f172a;background:#e6f2ff;padding:8px;border-radius:6px}
    @media (max-width:700px){th,td{padding:8px}}
  </style>
</head>
<body>
  <h1>年号・語呂合わせ（タップで表示／非表示）</h1>
  <p class="note">同ディレクトリの <code>goro_history.csv</code> を読み込んで表示します。初期は「年号」「語呂合わせ」がマスクされています。もしブラウザのセキュリティで自動読み込みがブロックされている場合は、下のボタンでファイルを選択してください（ローカルで開いたときに発生する表示問題を回避します）。</p>

  <div class="controls">
    <button id="toggleAll">すべて表示／非表示を切替</button>
    <label class="hint" id="status">読み込み中…</label>
    <input type="file" id="fileInput" accept=".csv" />
    <button id="reloadBtn">再読み込み</button>
  </div>

  <div id="tableWrap">読み込み中...</div>
  <div id="debug" style="margin-top:12px; font-size:0.9rem; color:#334155;"></div>

<script>
// CSVパーサー（シンプル）
function parseCSV(text){
  // BOM 削除
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const lines = text.split(/
?
/).filter(l=>l.trim()!=='');
  const rows = lines.map(line=>{
    const fields = [];
    let cur = '';
    let inQuotes = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(inQuotes){
        if(ch === '"'){
          if(line[i+1] === '"'){ cur += '"'; i++; }
          else { inQuotes = false; }
        } else { cur += ch; }
      } else {
        if(ch === '"'){ inQuotes = true; }
        else if(ch === ','){ fields.push(cur); cur = ''; }
        else { cur += ch; }
      }
    }
    fields.push(cur);
    return fields;
  });
  return rows;
}

function maskString(s){ return Array.from(s||'').map(()=>'●').join(''); }

function createTable(data){
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  ['年号','出来事','語呂合わせ'].forEach(t=>{ const th = document.createElement('th'); th.textContent = t; trh.appendChild(th); });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  data.forEach(row=>{
    const tr = document.createElement('tr');
    const year = row[0]||'';
    const event = row[1]||'';
    const goro = row[2]||'';

    const tdYear = document.createElement('td');
    const spY = document.createElement('span');
    spY.className='toggle-mask masked-text'; spY.tabIndex=0; spY.dataset.original=year; spY.dataset.masked=maskString(year); spY.dataset.state='masked'; spY.textContent=spY.dataset.masked; tdYear.appendChild(spY);

    const tdEvent = document.createElement('td'); tdEvent.className='muted'; tdEvent.textContent=event;

    const tdGoro = document.createElement('td');
    const spG = document.createElement('span');
    spG.className='toggle-mask masked-text'; spG.tabIndex=0; spG.dataset.original=goro; spG.dataset.masked=maskString(goro); spG.dataset.state='masked'; spG.textContent=spG.dataset.masked; tdGoro.appendChild(spG);

    tr.appendChild(tdYear); tr.appendChild(tdEvent); tr.appendChild(tdGoro);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

function addToggleBehavior(container){
  container.querySelectorAll('.toggle-mask').forEach(el=>{
    function toggle(){
      if(el.dataset.state === 'masked'){ el.textContent = el.dataset.original; el.dataset.state='unmasked'; el.setAttribute('aria-pressed','true'); }
      else { el.textContent = el.dataset.masked; el.dataset.state='masked'; el.setAttribute('aria-pressed','false'); }
    }
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }});
  });
}

function toggleAll(container){
  const anyMasked = Array.from(container.querySelectorAll('.toggle-mask')).some(el=>el.dataset.state==='masked');
  container.querySelectorAll('.toggle-mask').forEach(el=>{ if(anyMasked){ el.textContent=el.dataset.original; el.dataset.state='unmasked'; el.setAttribute('aria-pressed','true'); } else { el.textContent=el.dataset.masked; el.dataset.state='masked'; el.setAttribute('aria-pressed','false'); } });
}

async function tryFetchCSV(){
  const wrap=document.getElementById('tableWrap');
  const status=document.getElementById('status');
  status.textContent='goro_history.csv を自動読み込み中…';
  try{
    const res = await fetch('goro_history.csv');
    if(!res.ok) throw new Error('HTTP '+res.status);
    const txt = await res.text();
    const rows = parseCSV(txt);
    if(rows.length <= 1){ wrap.innerHTML='<div class="error">CSVの行数が不十分です。ファイルを確認するか、下のファイル選択で読み込んでください。</div>'; document.getElementById('debug').textContent='(自動読み込みは成功しましたが、データが見つかりませんでした)'; return; }
    const data = rows.slice(1).filter(r=>r.some(c=>c && c.trim()!=='') );
    const table = createTable(data);
    wrap.innerHTML=''; wrap.appendChild(table);
    addToggleBehavior(wrap);
    document.getElementById('debug').textContent='自動読み込みに成功しました。';
    status.textContent='自動読み込み成功';
  }catch(err){
    wrap.innerHTML='<div class="error">自動読み込みに失敗しました。原因: '+(err.message||err)+'</div>';
    document.getElementById('debug').textContent='自動読み込みエラー; ローカルでファイル:// を使っている場合はセキュリティ制限により失敗します。下の「ファイルを選択」から CSV を読み込んでください。';
    status.textContent='自動読み込み失敗';
    console.warn('fetch error', err);
  }
}

// ファイル選択で読み込む
function handleFile(file){
  const wrap=document.getElementById('tableWrap');
  const status=document.getElementById('status');
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const txt = e.target.result;
      const rows = parseCSV(txt);
      if(rows.length <= 1){ wrap.innerHTML='<div class="error">CSV の行数が不十分です。</div>'; return; }
      const data = rows.slice(1).filter(r=>r.some(c=>c && c.trim()!=='') );
      const table = createTable(data);
      wrap.innerHTML=''; wrap.appendChild(table);
      addToggleBehavior(wrap);
      status.textContent = 'ファイル読み込み成功: '+file.name;
      document.getElementById('debug').textContent = 'ファイル選択で読み込みました。';
    }catch(err){ wrap.innerHTML='<div class="error">ファイル読み込み中にエラーが発生しました: '+(err.message||err)+'</div>'; console.error(err); }
  };
  reader.onerror = function(e){ wrap.innerHTML='<div class="error">ファイルを読み込めませんでした。</div>'; };
  reader.readAsText(file, 'utf-8');
}

// 初期処理
window.addEventListener('DOMContentLoaded', ()=>{
  tryFetchCSV();
  document.getElementById('fileInput').addEventListener('change', (e)=>{ const f = e.target.files[0]; if(f) handleFile(f); });
  document.getElementById('reloadBtn').addEventListener('click', ()=>{ tryFetchCSV(); });
  document.getElementById('toggleAll').addEventListener('click', ()=>{ toggleAll(document.getElementById('tableWrap')); });
});
</script>
</body>
</html>
